<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Job Radar</title>
<style>
  :root {
    --bg:#fafaf9; --card:#fff; --ink:#1c1917; --mute:#78716c; --line:#e7e5e4; --hover:#f5f5f4;
    --accent:#0f766e; --accent-ink:#fff; --warn:#b45309; --bad:#b91c1c; --chip:#f0fdfa;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0c0a09; --card:#1c1917; --ink:#f5f5f4; --mute:#a8a29e; --line:#292524; --hover:#231f1d;
            --accent:#2dd4bf; --accent-ink:#042f2e; --warn:#fbbf24; --bad:#f87171; --chip:#0d2a27; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  header { position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line); padding:12px 16px 0; z-index:2; }
  .bar { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  h1 { font-size:16px; margin:0; }
  .stats { color:var(--mute); font-size:13px; }
  .stats b { color:var(--ink); font-variant-numeric:tabular-nums; }
  .err { color:var(--bad); }
  .tabs { display:flex; gap:2px; margin-top:10px; overflow-x:auto; }
  .tabs button { font:inherit; border:0; border-bottom:2px solid transparent; background:none; color:var(--mute); padding:6px 10px; cursor:pointer; white-space:nowrap; }
  .tabs button[aria-pressed=true] { border-color:var(--accent); color:var(--ink); font-weight:600; }
  .tabs .n { font-variant-numeric:tabular-nums; color:var(--mute); font-weight:400; margin-left:4px; }
  .tools { display:flex; gap:8px; padding:10px 16px; align-items:center; flex-wrap:wrap; }
  input[type=search] { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); min-width:240px; flex:1; max-width:380px; }
  .tools .count { color:var(--mute); font-size:13px; }
  button, select, .btn { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:6px; padding:4px 10px; cursor:pointer; text-decoration:none; display:inline-block; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
  button.icon { border:0; background:none; color:var(--mute); padding:4px 6px; font-size:16px; line-height:1; }
  button.icon:hover { color:var(--bad); }
  main { padding:0 16px 40px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; font-weight:600; color:var(--mute); text-transform:uppercase; letter-spacing:.03em; white-space:nowrap; user-select:none; }
  th[data-sort] { cursor:pointer; }
  th[data-sort]:hover { color:var(--ink); }
  th .arrow { opacity:.6; }
  tr.row:hover td { background:var(--hover); }
  tr.row td.role { cursor:pointer; }
  .title { font-weight:600; }
  .sub { color:var(--mute); font-size:12px; }
  .num { font-variant-numeric:tabular-nums; text-align:right; }
  .score { font-weight:700; color:var(--accent); }
  .score.low { color:var(--warn); }
  .tag { display:inline-block; font-size:11px; padding:0 6px; border-radius:999px; background:var(--chip); color:var(--accent); font-weight:600; margin-left:6px; vertical-align:1px; }
  .tag.closed { background:none; color:var(--bad); border:1px solid currentColor; }
  td.nowrap { white-space:nowrap; }
  tr.detail td { background:var(--bg); padding:12px 14px 16px; }
  .detail-grid { display:grid; grid-template-columns:minmax(0,1fr) 280px; gap:18px; }
  .kv { display:grid; grid-template-columns:max-content 1fr; gap:4px 12px; font-size:13px; margin-bottom:10px; }
  .kv dt { color:var(--mute); }
  .kv dd { margin:0; }
  .kv a { color:var(--accent); }
  .desc { white-space:pre-wrap; font-size:13px; max-height:360px; overflow:auto; border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:var(--card); }
  textarea { width:100%; min-height:90px; font:inherit; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); }
  .fb { display:flex; gap:6px; margin-top:8px; align-items:center; color:var(--mute); font-size:13px; }
  .fb button.on { border-color:var(--accent); }
  .empty { color:var(--mute); padding:40px 0; text-align:center; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:8px; display:none; gap:12px; align-items:center; z-index:3; }
  #toast button { background:none; border:0; color:inherit; text-decoration:underline; padding:0; }

  /* Phone: rows become cards. */
  @media (max-width: 760px) {
    thead { display:none; }
    table, tbody, tr, td { display:block; width:100%; }
    table { border:0; background:none; }
    tr.row { background:var(--card); border:1px solid var(--line); border-radius:10px; margin-top:10px; padding:6px 4px; position:relative; }
    tr.row td { border:0; padding:3px 10px; }
    tr.row td.num { text-align:left; }
    tr.row td[data-label]::before { content:attr(data-label) ": "; color:var(--mute); font-size:12px; }
    tr.row td.x { position:absolute; top:4px; right:4px; width:auto; }
    tr.detail td { border:1px solid var(--line); border-top:0; border-radius:0 0 10px 10px; }
    .detail-grid { grid-template-columns:1fr; }
    input[type=search] { min-width:0; max-width:none; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Job Radar</h1>
    <div class="stats" id="stats">Loading…</div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<div class="tools">
  <input type="search" id="q" placeholder="Filter by company, role, city…" />
  <span class="count" id="count"></span>
</div>
<main>
  <table>
    <thead><tr>
      <th data-sort="company">Company</th>
      <th data-sort="title">Role</th>
      <th>Location</th>
      <th data-sort="score" class="num">Score</th>
      <th data-sort="posted_at">Posted</th>
      <th data-sort="first_seen_at">Found</th>
      <th>Status</th>
      <th>Apply</th>
      <th></th>
    </tr></thead>
    <tbody id="list"></tbody>
  </table>
  <div class="empty" id="empty" hidden></div>
</main>
<div id="toast"></div>
<script>
const STATUS_LABEL = {
  to_apply:'To apply', maybe:'Maybe', applied:'Applied', recruiter_call:'Recruiter call', oa:'Online assessment',
  interviewing:'Interviewing', offer:'Offer', rejected:'Rejected', ghosted:'Ghosted', skipped:'Not interested', removed:'Removed',
};
const TABS = [
  ['to_apply', 'To apply', ['to_apply']],
  ['maybe', 'Maybe', ['maybe']],
  ['applied', 'Applied', ['applied']],
  ['process', 'In process', ['recruiter_call', 'oa', 'interviewing']],
  ['offer', 'Offer', ['offer']],
  ['done', 'Closed out', ['rejected', 'ghosted', 'skipped']],
  ['removed', 'Removed', ['removed']],
];
const CITY = { bengaluru:'Bengaluru', hyderabad:'Hyderabad', pune:'Pune', 'remote-india':'Remote (India)', 'india-other':'Elsewhere in India' };
const EMPTY = {
  to_apply: 'Nothing to apply to right now. New matches appear here after each poll.',
  maybe: 'No lower-scoring matches.',
  removed: 'Rows you remove land here, so you can undo.',
};

let tab = sessionGet('tab') || 'to_apply';
let rows = [];
let sort = { key: 'first_seen_at', dir: -1 };
const open = new Set();
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago = (d) => {
  if (!d) return '–';
  const m = (Date.now() - new Date(d)) / 60000;
  return m < 60 ? `${Math.max(1, Math.round(m))}m ago` : m < 1440 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`;
};
const fmtDate = (d) => d ? new Date(d).toLocaleDateString(undefined, { day:'numeric', month:'short', year:'numeric' }) : '';
function sessionGet(k) { try { return sessionStorage.getItem(k); } catch { return null; } }
function sessionSet(k, v) { try { sessionStorage.setItem(k, v); } catch {} }

async function api(path, opts) {
  const r = await fetch(path, { headers: { 'content-type': 'application/json' }, ...opts });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
const patch = (id, body) => api(`/api/jobs/${id}`, { method: 'PATCH', body: JSON.stringify(body) });

let counts = {};
function renderTabs() {
  $('#tabs').innerHTML = TABS.map(([k, label, sts]) => {
    const n = sts.reduce((a, s) => a + (counts[s] || 0), 0);
    return `<button aria-pressed="${k === tab}" data-tab="${k}">${label}<span class="n">${n}</span></button>`;
  }).join('');
}

async function loadStats() {
  try {
    const s = await api('/api/stats');
    counts = s.counts;
    renderTabs();
    const broken = s.sources.filter((x) => !x.ok);
    $('#stats').innerHTML = [
      `New (7d) <b>${s.week.new_matches}</b>`,
      `Applied (7d) <b>${s.week.applied}</b>`,
      `Last poll <b>${ago(s.week.last_poll)}</b>`,
      `Boards <b>${s.sources.length - broken.length}/${s.sources.length}</b>`
        + (broken.length ? ` <span class="err" title="${esc(broken.map((b) => b.company + ': ' + b.error).join('\n'))}">(${broken.length} failing)</span>` : ''),
    ].join(' · ');
  } catch (e) { $('#stats').textContent = 'Stats unavailable: ' + e.message; }
}

async function loadJobs() {
  const sts = TABS.find((t) => t[0] === tab)[2];
  rows = await api(`/api/jobs?status=${sts.join(',')}&limit=1000`);
  render();
}

function visible() {
  const q = $('#q').value.trim().toLowerCase();
  const list = q
    ? rows.filter((j) => [j.company, j.title, j.department, ...j.locations, ...j.cities.map((c) => CITY[c])].join(' ').toLowerCase().includes(q))
    : rows.slice();
  const { key, dir } = sort;
  return list.sort((a, b) => {
    const x = a[key], y = b[key];
    if (x == null && y == null) return 0;
    if (x == null) return 1;
    if (y == null) return -1;
    return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y))) * dir;
  });
}

function render() {
  const list = visible();
  document.querySelectorAll('th[data-sort]').forEach((th) => {
    const on = th.dataset.sort === sort.key;
    th.innerHTML = th.textContent.replace(/ [↑↓]$/, '') + (on ? ` <span class="arrow">${sort.dir > 0 ? '↑' : '↓'}</span>` : '');
  });
  $('#list').innerHTML = list.map((j) => rowHtml(j) + (open.has(j.id) ? detailHtml(j) : '')).join('');
  $('#count').textContent = `${list.length} of ${rows.length}`;
  const empty = $('#empty');
  empty.hidden = list.length > 0;
  empty.textContent = rows.length ? 'No rows match the filter.' : (EMPTY[tab] || 'Nothing here yet.');
  for (const id of open) if (!details.has(id)) loadDetail(id);
}

function rowHtml(j) {
  const isNew = Date.now() - new Date(j.first_seen_at) < 24 * 3600_000;
  // "Elsewhere in India" says little; show the posting's own location (e.g. "Chennai") instead.
  const where = j.cities.includes('india-other') ? j.locations.slice(0, 2).join(' / ') : j.cities.map((c) => CITY[c] || c).join(', ');
  const options = Object.entries(STATUS_LABEL).map(([v, l]) => `<option value="${v}" ${v === j.status ? 'selected' : ''}>${l}</option>`).join('');
  return `<tr class="row" data-id="${j.id}">
    <td data-label="Company"><b>${esc(j.company)}</b></td>
    <td class="role" data-act="toggle" title="Show details">
      <div class="title">${esc(j.title)}${isNew ? '<span class="tag">new</span>' : ''}${j.closed_at ? '<span class="tag closed">posting closed</span>' : ''}</div>
      ${j.department ? `<div class="sub">${esc(j.department)}</div>` : ''}
    </td>
    <td data-label="Location">${esc(where)}${j.remote ? '<div class="sub">remote</div>' : ''}</td>
    <td class="num" data-label="Score"><span class="score ${j.score < 60 ? 'low' : ''}" title="${esc(j.score_reasons.join('\n'))}">${j.score}</span></td>
    <td class="nowrap" data-label="Posted" title="${esc(fmtDate(j.posted_at))}">${j.posted_at ? ago(j.posted_at) : '–'}</td>
    <td class="nowrap" data-label="Found" title="${esc(fmtDate(j.first_seen_at))}">${ago(j.first_seen_at)}</td>
    <td><select data-act="status" aria-label="Status">${options}</select></td>
    <td class="nowrap"><a class="btn primary" href="${esc(j.apply_url || j.url)}" target="_blank" rel="noopener">Apply ↗</a></td>
    <td class="x">${j.status === 'removed' ? '' : `<button class="icon" data-act="remove" title="Remove (not applying)" aria-label="Remove">✕</button>`}</td>
  </tr>`;
}

const details = new Map();
async function loadDetail(id) {
  details.set(id, null);
  try { details.set(id, await api(`/api/jobs/${id}`)); } catch (e) { details.set(id, { description: 'Could not load: ' + e.message }); }
  if (open.has(id)) render();
}

function detailHtml(j) {
  const d = details.get(j.id);
  const links = [`<a href="${esc(j.url)}" target="_blank" rel="noopener">Job posting ↗</a>`];
  if (j.apply_url && j.apply_url !== j.url) links.push(`<a href="${esc(j.apply_url)}" target="_blank" rel="noopener">Application form ↗</a>`);
  return `<tr class="detail" data-id="${j.id}"><td colspan="9"><div class="detail-grid">
    <div>
      <dl class="kv">
        <dt>Links</dt><dd>${links.join(' · ')}</dd>
        <dt>Locations</dt><dd>${esc(j.locations.join(' · ') || '–')}</dd>
        <dt>Posted</dt><dd>${esc(fmtDate(j.posted_at) || 'not given by the board')}</dd>
        <dt>First seen</dt><dd>${esc(fmtDate(j.first_seen_at))} (${ago(j.first_seen_at)})</dd>
        ${j.applied_at ? `<dt>Applied</dt><dd>${esc(fmtDate(j.applied_at))}</dd>` : ''}
        ${j.closed_at ? `<dt>Closed</dt><dd>${esc(fmtDate(j.closed_at))}</dd>` : ''}
        <dt>Why ${j.score}</dt><dd>${esc(j.score_reasons.join(' · '))}</dd>
        <dt>Source</dt><dd>${esc(j.ats)}</dd>
      </dl>
      <div class="desc">${d ? esc(d.description || 'No description.') : 'Loading description…'}</div>
    </div>
    <div>
      <label class="sub" for="notes-${j.id}">Notes (referral, CTC asked, round dates…)</label>
      <textarea id="notes-${j.id}" data-act="notes">${esc(j.notes || '')}</textarea>
      <div class="fb">Good match?
        <button data-act="fb" data-v="1" class="${j.verdict === 1 ? 'on' : ''}" aria-label="Good match">👍</button>
        <button data-act="fb" data-v="-1" class="${j.verdict === -1 ? 'on' : ''}" aria-label="Bad match">👎</button>
      </div>
    </div>
  </div></td></tr>`;
}

let toastTimer;
function toast(html, onUndo) {
  const t = $('#toast');
  t.innerHTML = html + (onUndo ? ' <button>Undo</button>' : '');
  t.style.display = 'flex';
  if (onUndo) t.querySelector('button').onclick = () => { t.style.display = 'none'; onUndo(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.style.display = 'none'), 6000);
}

const refresh = () => Promise.all([loadJobs(), loadStats()]);
const job = (id) => rows.find((r) => r.id === id);

document.addEventListener('click', async (e) => {
  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn) { tab = tabBtn.dataset.tab; sessionSet('tab', tab); open.clear(); renderTabs(); return loadJobs(); }
  const th = e.target.closest('th[data-sort]');
  if (th) {
    const k = th.dataset.sort;
    sort = sort.key === k ? { key: k, dir: -sort.dir } : { key: k, dir: ['company', 'title'].includes(k) ? 1 : -1 };
    return render();
  }
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'SELECT' || el.tagName === 'TEXTAREA') return;
  const id = Number(el.closest('tr').dataset.id);
  const act = el.dataset.act;
  if (act === 'toggle') { open.has(id) ? open.delete(id) : open.add(id); return render(); }
  if (act === 'remove') {
    const prev = job(id).status;
    await api(`/api/jobs/${id}`, { method: 'DELETE' });
    toast(`Removed “${esc(job(id).title)}”`, async () => { await patch(id, { status: prev }); refresh(); });
    return refresh();
  }
  if (act === 'fb') {
    await api(`/api/jobs/${id}/feedback`, { method: 'POST', body: JSON.stringify({ verdict: Number(el.dataset.v) }) });
    job(id).verdict = Number(el.dataset.v);
    return render();
  }
});

document.addEventListener('change', async (e) => {
  if (e.target.dataset.act !== 'status') return;
  const id = Number(e.target.closest('tr').dataset.id);
  const prev = job(id).status;
  const next = e.target.value;
  await patch(id, { status: next });
  toast(`Moved to ${esc(STATUS_LABEL[next])}`, async () => { await patch(id, { status: prev }); refresh(); });
  refresh();
});

// Notes save when you leave the box.
document.addEventListener('focusout', async (e) => {
  if (e.target.dataset?.act !== 'notes') return;
  const id = Number(e.target.closest('tr').dataset.id);
  if ((job(id).notes || '') === e.target.value) return;
  await patch(id, { notes: e.target.value });
  job(id).notes = e.target.value;
  toast('Notes saved');
});

$('#q').addEventListener('input', render);
renderTabs(); refresh();
// Pick up new matches from the poller without stomping on a half-typed note.
setInterval(() => { if (!document.activeElement?.matches('textarea, select')) refresh(); }, 120_000);
</script>
</body>
</html>
